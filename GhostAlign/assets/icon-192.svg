  <path d="M140 180 L180 130 L332 130 L372 180 L420 180 C437.6 180 452 194.4 452 212 L452 388 C452 405.6 437.6 420 420 420 L92 420 C74.4 420 60 405.6 60 388 L60 212 C60 194.4 74.4 180 92 180 Z" 
